# Atualiza os dados e publica o site no GitHub Pages.
#
# - Quem dispara a rotina a cada hora é o acionador do Google Apps Script, na conta do LADRI
#   (acionador/acionador.gs), no modo "agenda"; o agendamento abaixo fica como reserva. Em cada execução, o
#   primeiro job ("plano") decide, pela idade dos dados já publicados, o que está na hora (01_coleta.py --plano):
#     SRAG, arboviroses e clima: a cada 6 horas (as fontes publicam uma vez por semana; a coleta confere se
#     há extração nova antes de baixar); notícias: a cada hora.
#   Se nada estiver na hora, a execução termina ali, sem publicar.
# - Envio de código (push) ou execução manual: atualiza tudo.
# - Os JSON da semana (docs/dados/) não vão para o repositório: são gerados aqui e publicados direto no Pages.
#   As séries municipais das arboviroses (docs/dados/arbo/<UF>.json) são recuperadas do site publicado e
#   acumuladas a cada semana.
# - Privacidade: os arquivos do SIVEP-Gripe (uma linha por pessoa) são lidos e apagados dentro do 01_coleta.py;
#   o 04_validar.py confere que nada individual foi parar no que é publicado.
# - 04_validar.py confere tudo antes de publicar: se reprovar, o site continua na última versão boa.
# - As ações de terceiros estão fixadas pelo SHA do commit (com a versão no comentário).
#
# Configuração única no GitHub:
#   Settings → Pages → Source: "GitHub Actions".
#   Settings → Secrets and variables → Actions → New repository secret: MOSQLIMATE_KEY (chave da API do Mosqlimate).
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 */2 * * *"   # reserva do acionador do Google
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = atualiza tudo (execução manual); agenda = só o que está na hora (usado pelo acionador do Google)"
        type: choice
        options: [completo, agenda]
        default: completo
      arbo_semanas:
        description: "Semanas de arboviroses a buscar (12 = normal; até 46 cabe no tempo da rotina; carga maior, rode no computador)"
        default: "12"
      gdelt_horas:
        description: "Horas de notícias do GDELT (3 = normal; 72 na primeira execução)"
        default: "3"
  push:
    branches: [main]
    paths: ["docs/index.html", "0*.py", "saude_comum.py", ".github/workflows/atualizar.yml"]

permissions:
  contents: read

concurrency:
  group: atualizar
  cancel-in-progress: false

env:
  SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  plano:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fontes: ${{ steps.plano.outputs.fontes }}
      blocos: ${{ steps.plano.outputs.blocos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Decidir o que está na hora
        id: plano
        env:
          COMPLETO: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'agenda')) && '--completo' || '' }}
        run: |
          mkdir -p docs/dados
          curl -sfL "$SITE/dados/atualizacao.json" -o docs/dados/atualizacao.json || rm -f docs/dados/atualizacao.json
          python 01_coleta.py --plano $COMPLETO | tee -a "$GITHUB_OUTPUT"

  atualizar:
    needs: plano
    if: needs.plano.outputs.blocos != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180   # arboviroses: ~3 min por semana buscada (12 semanas ≈ 35 min; 46 semanas ≈ 2 h 30)
    permissions:
      contents: read
      pages: write         # publicar no Pages
      id-token: write      # exigido pelo deploy do Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Se uma fonte falhar (ou não tiver dados novos), os dados publicados antes são mantidos
      - name: Recuperar os dados publicados
        run: |
          mkdir -p docs/dados/arbo
          for f in srag arbo clima noticias atualizacao; do
            curl -sfL "$SITE/dados/$f.json" -o "docs/dados/$f.json" || rm -f "docs/dados/$f.json"
          done
          for uf in AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO; do
            curl -sfL "$SITE/dados/arbo/$uf.json" -o "docs/dados/arbo/$uf.json" || rm -f "docs/dados/arbo/$uf.json"
          done

      - name: Coleta
        env:
          FONTES: ${{ needs.plano.outputs.fontes }}
          MOSQLIMATE_KEY: ${{ secrets.MOSQLIMATE_KEY }}
          ARBO_SEMANAS: ${{ inputs.arbo_semanas || '12' }}   # via variável: o Python só aceita 2–110
          GDELT_HORAS: ${{ inputs.gdelt_horas || '3' }}      # via variável: o Python só aceita 1–336
        run: python 01_coleta.py --fonte $FONTES --arbo-semanas "$ARBO_SEMANAS" --gdelt-horas "$GDELT_HORAS"

      - name: Tratamento
        env:
          BLOCOS: ${{ needs.plano.outputs.blocos }}
        run: python 02_tratamento.py --bloco $BLOCOS

      - name: Validação
        run: python 04_validar.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
